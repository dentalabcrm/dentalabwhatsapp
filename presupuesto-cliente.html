<html lang="es">
<head>
<meta charset="UTF-8">

<title>Presupuesto · Dentalab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#f4f6fa; --panel:#ffffff; --panel2:#eef1f6; --border:#e1e6ee;
    --text:#0f172a; --text2:#475569; --text3:#8592a6;
    --green:#0ea968; --red:#dc2626; --blue:#0284c7; --amber:#d97706;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; padding:18px 14px 40px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .brand-logo{height:32px;width:auto;display:block;object-fit:contain;}
  .brand-sub{font-size:11px;color:var(--text3);margin-top:3px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.05);}
  .header-card .num{font-family:'DM Mono',monospace;color:var(--blue);font-size:13px;font-weight:500;}
  .header-card h1{font-size:19px;font-weight:800;margin-top:4px;line-height:1.3;}
  .header-card .fecha{font-size:12px;color:var(--text3);margin-top:6px;}

  .items-list{display:flex;flex-direction:column;gap:10px;}
  .item{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:14px; display:flex; flex-direction:column; gap:10px;
    box-shadow:0 1px 3px rgba(15,23,42,.05);
  }
  .item.removing{opacity:.35;pointer-events:none;transform:scale(.98);transition:all .2s;}
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .item-nombre{font-size:14px;font-weight:600;line-height:1.35;}
  .item-precio{font-size:11.5px;color:var(--text3);margin-top:3px;}
  .item-quitar{
    background:none;border:1px solid var(--border);color:var(--text3);
    width:28px;height:28px;border-radius:8px;font-size:14px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .item-quitar:hover{background:rgba(220,38,38,.08);border-color:var(--red);color:var(--red);}
  .item-bottom{display:flex;justify-content:space-between;align-items:center;}
  .qty-stepper{display:flex;align-items:center;gap:0;background:var(--panel2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .qty-stepper button{
    background:none;border:none;color:var(--text);width:38px;height:38px;font-size:17px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;
  }
  .qty-stepper button:hover{background:var(--border);}
  .qty-stepper button:disabled{opacity:.3;cursor:default;background:none;}
  .qty-stepper .qty-val{width:34px;text-align:center;font-family:'DM Mono',monospace;font-size:14px;font-weight:600;}
  .item-subtotal{font-family:'DM Mono',monospace;font-size:14.5px;font-weight:700;}

  .vacio{text-align:center;padding:30px 10px;color:var(--text3);font-size:13.5px;}

  .totales{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-top:14px;box-shadow:0 1px 3px rgba(15,23,42,.05);}
  .totales .row{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);padding:3px 0;}
  .totales .row.final{font-size:18px;font-weight:800;color:var(--text);border-top:1px solid var(--border);margin-top:8px;padding-top:10px;}

  .btn-confirmar{
    width:100%;margin-top:16px;background:var(--green);border:none;border-radius:14px;
    padding:15px;color:#ffffff;font-size:15px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s;
    box-shadow:0 2px 8px rgba(14,169,104,.25);
  }
  .btn-confirmar:hover{filter:brightness(1.08);}
  .btn-confirmar:disabled{opacity:.55;cursor:default;filter:none;}

  .nota{font-size:11.5px;color:var(--text3);text-align:center;margin-top:10px;line-height:1.5;}

  .estado-msg{margin-top:14px;padding:14px;border-radius:12px;font-size:13.5px;text-align:center;line-height:1.5;}
  .estado-msg.ok{background:rgba(14,169,104,.08);border:1px solid rgba(14,169,104,.3);color:#0a7a4a;}
  .estado-msg.err{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.3);color:#b91c1c;}

  .loading, .error-box{
    text-align:center;padding:60px 20px;color:var(--text3);font-size:14px;
  }
  .error-box{color:#b91c1c;}
  .spinner{
    width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--blue);
    border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

      <div class="brand-sub">Presupuesto</div>
    </div>
    <div id="app">
      <div class="loading"><div class="spinner"></div>Cargando presupuesto…</div>
    </div>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBNClZ7vjIKfSwuQf2TKaiUpYvPP5VnvQg",
  authDomain: "dentalab-crm-20f55.firebaseapp.com",
  databaseURL: "https://dentalab-crm-20f55-default-rtdb.firebaseio.com",
  projectId: "dentalab-crm-20f55",
  storageBucket: "dentalab-crm-20f55.firebasestorage.app",
  messagingSenderId: "654358567235",
  appId: "1:654358567235:web:6cd3ac0c6efd7dba5077f6",
  measurementId: "G-E1WMGLKN6V"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(location.search);
const id = params.get('id');
const app = document.getElementById('app');

let original = null;   // snapshot tal cual se guardó desde el CRM
let propuesta = null;  // copia editable por el cliente
let yaEnviado = false;

function escHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){
  return '$' + Math.round(n || 0).toLocaleString('es-AR');
}
function calcLinea(it){
  const base = (it.precio || 0) * (it.qty || 1);
  const conDesc = base * (1 - (it.disc || 0) / 100);
  return conDesc;
}
function calcTotales(){
  const subtotal = propuesta.items.reduce((s, it) => s + calcLinea(it), 0);
  const total = subtotal * (1 - (propuesta.globalDisc || 0) / 100);
  return { subtotal, total };
}
function hayCambios(){
  if (!original) return false;
  if (propuesta.items.length !== original.items.length) return true;
  return propuesta.items.some((it, i) => {
    const o = original.items[i];
    return !o || it.qty !== o.qty || it.sku !== o.sku;
  });
}

function render(){
  if (yaEnviado) return; // no re-renderizar después de confirmar
  const { subtotal, total } = calcTotales();

  const itemsHtml = propuesta.items.length
    ? propuesta.items.map((it, idx) => `
      <div class="item" id="item-${idx}">
        <div class="item-top">
          <div>
            <div class="item-nombre">${escHtml(it.nombre)}</div>
            <div class="item-precio">${fmtMoney(it.precio)} c/u${it.disc ? ` · ${it.disc}% off` : ''}</div>
          </div>
          <button class="item-quitar" onclick="quitarItem(${idx})" title="Quitar producto">✕</button>
        </div>
        <div class="item-bottom">
          <div class="qty-stepper">
            <button onclick="cambiarQty(${idx}, -1)" ${it.qty <= 1 ? 'disabled' : ''}>−</button>
            <span class="qty-val">${it.qty}</span>
            <button onclick="cambiarQty(${idx}, 1)">+</button>
          </div>
          <div class="item-subtotal">${fmtMoney(calcLinea(it))}</div>
        </div>
      </div>
    `).join('')
    : `<div class="vacio">No quedan productos en este presupuesto.</div>`;

  const cambios = hayCambios();

  app.innerHTML = `
    <div class="card header-card">
      <div class="num">PRESUPUESTO #${escHtml(String(original.num || '').padStart(4,'0'))}</div>
      <h1>${escHtml(original.cliente?.nombre || 'Presupuesto')}</h1>
      <div class="fecha">Podés ajustar las cantidades o sacar productos que no quieras.</div>
    </div>

    <div class="items-list">${itemsHtml}</div>

    <div class="totales">
      ${propuesta.globalDisc ? `
        <div class="row"><span>Subtotal</span><span>${fmtMoney(subtotal)}</span></div>
        <div class="row"><span>Descuento (${propuesta.globalDisc}%)</span><span>−${fmtMoney(subtotal - total)}</span></div>
      ` : ''}
      <div class="row final"><span>Total</span><span>${fmtMoney(total)}</span></div>
    </div>

    <button class="btn-confirmar" id="btn-confirmar" onclick="confirmarCambios()" ${propuesta.items.length === 0 ? 'disabled' : ''}>
      ${cambios ? '✓ Confirmar cambios y avisar a Dentalab' : '✓ Está bien así, avisar a Dentalab'}
    </button>
    <div class="nota">Al confirmar, le avisamos a Dentalab. Ellos van a revisar y coordinar el resto con vos.</div>
    <div id="estado-msg"></div>
  `;
}

window.cambiarQty = (idx, delta) => {
  const it = propuesta.items[idx];
  if (!it) return;
  it.qty = Math.max(1, (it.qty || 1) + delta);
  render();
};

window.quitarItem = (idx) => {
  const el = document.getElementById(`item-${idx}`);
  if (el) el.classList.add('removing');
  setTimeout(() => {
    propuesta.items.splice(idx, 1);
    render();
  }, 150);
};

window.confirmarCambios = async () => {
  const btn = document.getElementById('btn-confirmar');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = 'Enviando…';
  const { total } = calcTotales();
  try {
    await db.ref('dentalab/presupuestos_publicos/' + id + '/propuestaCliente').set({
      items: propuesta.items,
      globalDisc: propuesta.globalDisc || 0,
      total,
      estado: 'pendiente',
      enviadoAt: Date.now()
    });
    yaEnviado = true;
    document.getElementById('estado-msg').innerHTML =
      `<div class="estado-msg ok">✓ ¡Listo! Te llevamos a WhatsApp para avisarle a Dentalab…</div>`;
    btn.style.display = 'none';

    // Redirigir a WhatsApp de Dentalab con el aviso ya escrito
    const WA_NUM = '5491168714595';
    const nombreCliente = (original.cliente?.nombre || '').trim();
    const numStr = String(original.num || '').padStart(4, '0');
    const msg = `Hola! ${nombreCliente ? 'Soy ' + nombreCliente + '. ' : ''}Modifiqué mi presupuesto N° ${numStr} — nuevo total ${fmtMoney(total)}. ¿Podrían confirmarme los cambios?`;
    const waLink = `https://wa.me/${WA_NUM}?text=${encodeURIComponent(msg)}`;
    setTimeout(() => { window.location.href = waLink; }, 900);
  } catch (e) {
    document.getElementById('estado-msg').innerHTML =
      `<div class="estado-msg err">No pudimos enviar los cambios. Revisá tu conexión e intentá de nuevo.</div>`;
    btn.disabled = false;
    btn.textContent = '✓ Confirmar cambios y avisar a Dentalab';
  }
};

function renderError(msg){
  app.innerHTML = `<div class="error-box">⚠ ${escHtml(msg)}</div>`;
}

async function cargar(){
  if (!id) { renderError('Este link no tiene un presupuesto asociado.'); return; }
  try {
    const snap = await db.ref('dentalab/presupuestos_publicos/' + id).once('value');
    const data = snap.val();
    if (!data) { renderError('No encontramos este presupuesto. Puede que el link haya vencido — pedile a Dentalab que te lo reenvíe.'); return; }
    original = data;
    propuesta = {
      items: (data.items || []).map(it => ({ ...it })),
      globalDisc: data.globalDisc || 0
    };
    render();
  } catch (e) {
    renderError('No pudimos cargar el presupuesto. Revisá tu conexión e intentá de nuevo.');
  }
}

cargar();
</script>
