<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pedido por WhatsApp · Dentalab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#f4f6fa; --panel:#ffffff; --panel2:#eef1f6; --border:#e1e6ee;
    --text:#0f172a; --text2:#475569; --text3:#8592a6;
    --green:#0ea968; --red:#dc2626; --blue:#0284c7; --amber:#d97706;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; padding:18px 14px 90px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .brand-logo{height:32px;width:auto;display:block;object-fit:contain;}
  .brand-sub{font-size:11px;color:var(--text3);margin-top:3px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.05);}
  .card h1{font-size:17px;font-weight:800;margin-bottom:4px;}
  .card .sub{font-size:12.5px;color:var(--text3);line-height:1.5;}

  .loading, .error-box{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px;}
  .error-box{color:#b91c1c;}
  .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ── Selección de forma de pago ── */
  .pago-opciones{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .pago-card{
    border:2px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;
    background:var(--panel2);transition:all .15s;text-align:left;
  }
  .pago-card:hover{border-color:var(--blue);}
  .pago-card .pc-titulo{font-size:15px;font-weight:800;color:var(--text);}
  .pago-card .pc-desc{font-size:12px;color:var(--text3);margin-top:3px;line-height:1.5;}
  .pago-card .pc-badge{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .pago-card.contado .pc-badge{background:#0ea96814;color:var(--green);}
  .pago-card.tarjeta .pc-badge{background:#0284c714;color:var(--blue);}

  /* ── Barra superior con forma de pago activa ── */
  .pago-activo{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--panel2);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;
  }
  .pago-activo b{color:var(--text);}
  .pago-activo button{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:11.5px;color:var(--text2);cursor:pointer;}

  /* ── Buscador ── */
  .buscador-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .filtros-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
  .filtros-row select{
    border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:12.5px;
    background:var(--panel2);color:var(--text);font-family:'DM Sans',sans-serif;
  }
  .filtros-row select:focus{outline:2px solid var(--blue);outline-offset:-1px;background:#fff;}
  .chk-ofertas{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);white-space:nowrap;cursor:pointer;}
  .prod-oferta{font-size:10px;color:var(--red);font-weight:700;margin-top:2px;}
  .prod-consultar{font-size:12px;color:var(--text3);font-style:italic;font-family:'DM Sans',sans-serif;font-weight:500;}
  .buscador-row input[type="text"]{
    flex:1;min-width:200px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;
    font-size:13.5px;background:var(--panel2);color:var(--text);
  }
  .buscador-row input[type="text"]:focus{outline:2px solid var(--blue);outline-offset:-1px;background:#fff;}
  .chk-stock{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);white-space:nowrap;cursor:pointer;}
  .btn-ir-final{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:9px 14px;font-size:12.5px;color:var(--text2);cursor:pointer;white-space:nowrap;}
  .btn-ir-final:hover{border-color:var(--blue);color:var(--blue);}

  .resultados{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:520px;overflow-y:auto;}
  .prod-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;
  }
  .prod-row-clickeable{cursor:pointer;transition:background .12s,border-color .12s;}
  .prod-row-clickeable:hover{background:#dbeafe;border-color:var(--blue);}
  .prod-row-clickeable:active{background:#bfdbfe;}
  .prod-row-en-carrito{background:#dbeafe;border-color:var(--blue);border-width:2px;}
  .prod-row-en-carrito:hover{background:#c7e0fd;}
  .prod-info{flex:1;min-width:0;}
  .prod-foto{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--border);}
  .prod-foto-vacia{display:flex;align-items:center;justify-content:center;font-size:18px;opacity:.4;}
  .prod-sku{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--text3);}
  .prod-nombre{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;}
  .prod-stock-bajo{font-size:10px;color:var(--amber);font-weight:600;margin-top:2px;}
  .prod-stock-agotado{font-size:10px;color:var(--red);font-weight:600;margin-top:2px;}
  .prod-stock-en{font-size:10px;color:var(--green);font-weight:600;margin-top:2px;}
  .aviso-dientes{display:inline-block;font-size:11px;font-weight:700;color:var(--blue);margin-top:5px;text-decoration:none;background:#0284c714;padding:4px 9px;border-radius:20px;}
  .aviso-dientes:hover{text-decoration:underline;}
  .prod-precio{font-family:'DM Mono',monospace;font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap;}
  .prod-add{
    background:var(--blue);border:none;border-radius:8px;width:30px;height:30px;color:#fff;
    font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  }
  .prod-add:disabled{opacity:.35;cursor:default;}
  .sin-resultados{text-align:center;padding:20px;color:var(--text3);font-size:12.5px;}
  .mas-resultados{text-align:center;padding:8px;color:var(--text3);font-size:11px;}
  .paginacion{display:flex;flex-direction:column;gap:8px;align-items:center;padding:12px 4px 4px;border-top:1px solid var(--border);margin-top:4px;}
  .pag-info{font-size:11.5px;color:var(--text3);}
  .pag-botones{display:flex;gap:8px;}
  .pag-botones button{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:12.5px;color:var(--text);cursor:pointer;}
  .pag-botones button:disabled{opacity:.35;cursor:default;}
  .pag-salto{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
  .pag-salto input{width:56px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-family:'DM Mono',monospace;font-size:12.5px;text-align:center;background:var(--panel2);color:var(--text);}
  .pag-salto input:focus{outline:2px solid var(--blue);outline-offset:-1px;background:#fff;}
  .pag-salto button{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--text);cursor:pointer;}

  /* ── Carrito ── */
  .carrito-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--border);
  }
  .carrito-item:last-child{border-bottom:none;}
  .ci-info{flex:1;min-width:0;}
  .ci-nombre{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;}
  .ci-precio{font-size:11px;color:var(--text3);margin-top:1px;}
  .qty-stepper{display:flex;align-items:center;gap:0;background:var(--panel2);border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-shrink:0;}
  .qty-stepper button{background:none;border:none;color:var(--text);width:30px;height:30px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .qty-stepper button:hover{background:var(--border);}
  .qty-stepper .qty-val{width:40px;text-align:center;font-family:'DM Mono',monospace;font-size:12.5px;font-weight:600;border:none;background:transparent;color:var(--text);padding:0;-moz-appearance:textfield;}
  .qty-stepper .qty-val::-webkit-outer-spin-button, .qty-stepper .qty-val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .qty-stepper .qty-val:focus{outline:2px solid var(--blue);outline-offset:-1px;border-radius:4px;}
  .ci-subtotal{font-family:'DM Mono',monospace;font-size:13px;font-weight:700;width:82px;text-align:right;flex-shrink:0;}
  .ci-quitar{background:none;border:1px solid var(--border);color:var(--text3);width:26px;height:26px;border-radius:7px;font-size:12px;cursor:pointer;flex-shrink:0;}
  .ci-quitar:hover{background:rgba(220,38,38,.08);border-color:var(--red);color:var(--red);}
  .carrito-vacio{text-align:center;padding:20px;color:var(--text3);font-size:12.5px;}

  .totales{background:var(--panel2);border-radius:12px;padding:14px 16px;margin-top:12px;}
  .totales .row{display:flex;justify-content:space-between;font-size:16px;font-weight:800;color:var(--text);}

  .cliente-fields{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px;}
  @media(min-width:560px){.cliente-fields{grid-template-columns:1fr 1fr 1fr;}}
  .field label{display:block;font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
  .field input{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-family:'DM Sans',sans-serif;font-size:13.5px;color:var(--text);background:var(--panel2);}
  .field textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-family:'DM Sans',sans-serif;font-size:13.5px;color:var(--text);background:var(--panel2);}
  .field textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;background:#fff;}
  .field input:focus{outline:2px solid var(--blue);outline-offset:-1px;background:#fff;}

  .btn-enviar{
    width:100%;margin-top:16px;background:var(--green);border:none;border-radius:14px;
    padding:15px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s;
    box-shadow:0 2px 8px rgba(14,169,104,.25);
  }
  .btn-enviar:hover{filter:brightness(1.08);}
  .btn-enviar:disabled{opacity:.55;cursor:default;filter:none;}

  .nota{font-size:11.5px;color:var(--text3);text-align:center;margin-top:10px;line-height:1.5;}
  .estado-msg{margin-top:14px;padding:14px;border-radius:12px;font-size:13.5px;text-align:center;line-height:1.5;}
  .estado-msg.ok{background:rgba(14,169,104,.08);border:1px solid rgba(14,169,104,.3);color:#0a7a4a;}
  .estado-msg.err{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.3);color:#b91c1c;}
</style>
</head>

    renderSeleccionEntrega();
  } catch (e) {

// Dado un término ya escrito por el usuario, devuelve [término, ...sinónimos del mismo grupo]
function _candidatosSinonimos(t){
  const candidatos = [t];
  if (t.length < 3) return candidatos; // evita falsos positivos con términos muy cortos
  SINONIMOS.forEach(grupo => {
    if (grupo.some(g => g === t || g.includes(t) || t.includes(g))) {
      grupo.forEach(g => { if (!candidatos.includes(g)) candidatos.push(g); });
    }
  });
  return candidatos;
}

function _matchLiteral(idx, tokens){
  const fields = [idx[0], idx[1]];
  const fieldsSinPunt = [idx[2], idx[3]];
  return tokens.every(t => fields.some(f => f.includes(t)) || fieldsSinPunt.some(f => f.includes(_stripAccents(t))));
}

const ACRILICO_ROSA_TODOS_SKUS = Array.from(new Set([...ACRILICO_ROSA_AUTO_SKUS, ...ACRILICO_ROSA_TERMO_SKUS]));
const ADHESIVO_COMPOSITE_SKUS = ['1542','1543','1545','1546','1548','1715','21250','21252','21253','21350','21351'];

// ── Grupos especiales de búsqueda: cada uno se activa cuando el texto buscado contiene
//    TODAS las palabras de "requiere" (en cualquier orden). Al activarse, muestra su lista
//    fija de SKUs, y cualquier palabra extra que se haya escrito filtra dentro de esa lista.
//    Para sumar uno nuevo: agregar un objeto acá, no hace falta tocar el resto del código. ──
const GRUPOS_ESPECIALES = [
  { requiere: ['acrilico', 'rosa'], requiereAlt: { acrilico: ['polimero'] }, skus: ACRILICO_ROSA_TODOS_SKUS },
  { requiere: ['acrilico', 'cristal'], requiereAlt: { acrilico: ['polimero'], cristal: ['transparente'] }, skus: ACRILICO_CRISTAL_SKUS },
  { requiere: ['adhesivo', 'composite'], skus: ADHESIVO_COMPOSITE_SKUS },
];
const _STOPWORDS_BUSQUEDA = new Set(['para','de','del','la','el','los','las','p','y','o','con','sin']);

function _buscarGrupoEspecial(tokens){
  for (const grupo of GRUPOS_ESPECIALES) {
    const conceptoTokens = new Set();
    const cumple = grupo.requiere.every(palabra => {
      const alternativas = [palabra, ...((grupo.requiereAlt && grupo.requiereAlt[palabra]) || [])];
      alternativas.forEach(a => conceptoTokens.add(a));
      return alternativas.some(a => tokens.includes(a));
    });
    if (cumple) return { skus: grupo.skus, conceptoTokens };
  }
  return null;
}

function buscarProductos(){
  const q = busqueda.trim().toLowerCase();
  let base = catalogo;
  // (se muestran todos los productos, con o sin stock)
  if (filtroMarca !== 'todas') base = base.filter(it => it.m === filtroMarca);
  if (filtroCategoria !== 'todas') base = base.filter(it => it.g === filtroCategoria);
  if (filtroSoloOfertas) base = base.filter(it => it.of);

  const tokens = q.split(/\s+/).filter(Boolean).map(t => _stripAccents(t));
  let ordenados;

  if (tokens.length) {
    // Grupos especiales: abren una familia/lista fija de productos aunque el nombre real no
    // diga esas palabras exactas. Cualquier palabra extra filtra DENTRO de esa lista.
    const grupoActivo = _buscarGrupoEspecial(tokens);

    if (grupoActivo) {
      const tokensRestantes = tokens.filter(t => !grupoActivo.conceptoTokens.has(t) && !_STOPWORDS_BUSQUEDA.has(t));
      let candidatos = grupoActivo.skus.map(sku => catalogoBySku.get(sku)).filter(Boolean);
      if (tokensRestantes.length) {
        candidatos = candidatos.filter(it => {
          const idx = _getSearchIdx(it);
          const fields = [idx[0], idx[1]];
          const fieldsSinPunt = [idx[2], idx[3]];
          return tokensRestantes.every(t =>
            fields.some(f => f.includes(t)) || fieldsSinPunt.some(f => f.includes(_stripAccents(t)))
          );
        });
      }
      if (filtroMarca !== 'todas') candidatos = candidatos.filter(it => it.m === filtroMarca);
      if (filtroCategoria !== 'todas') candidatos = candidatos.filter(it => it.g === filtroCategoria);
      if (filtroSoloOfertas) candidatos = candidatos.filter(it => it.of);
      ordenados = candidatos.sort((a, b) => a.n.localeCompare(b.n, 'es'));
    } else {
      const resultados = base.filter(it => {
        const idx = _getSearchIdx(it);
        const fields = [idx[0], idx[1]];
        const fieldsSinPunt = [idx[2], idx[3]];
        return tokens.every(t => {
          const candidatos = _candidatosSinonimos(t);
          return candidatos.some(c =>
            fields.some(f => f.includes(c)) || fieldsSinPunt.some(f => f.includes(_stripAccents(c)))
          );
        });
      });
      // Coincidencias exactas con lo que se escribió van primero; las que aparecen
      // solo por sinónimo (ej: "Gorro" encontrando "Cofia") van después.
      ordenados = resultados.slice().sort((a, b) => {
        const litA = _matchLiteral(_getSearchIdx(a), tokens);
        const litB = _matchLiteral(_getSearchIdx(b), tokens);
        if (litA !== litB) return litA ? -1 : 1;
        return a.n.localeCompare(b.n, 'es');
      });
    }
  } else {
    ordenados = base.slice().sort((a, b) => a.n.localeCompare(b.n, 'es'));
  }

  // El orden por precio, si está activo, manda por sobre el resto.
  if (filtroOrdenPrecio === 'asc' || filtroOrdenPrecio === 'desc') {
    ordenados.sort((a, b) => {
      const va = precioDe(a), vb = precioDe(b);
      return filtroOrdenPrecio === 'asc' ? va - vb : vb - va;
    });
  }
  return ordenados;
}

function marcasDisponibles(){
  const set = new Set();
  catalogo.forEach(it => { if (it.m) set.add(it.m); });
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'es'));
}

function categoriasDisponibles(){
  const set = new Set();
  catalogo.forEach(it => { if (it.g) set.add(it.g); });
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'es'));
}

function renderResultados(){
  const cont = document.getElementById('resultados');
  if (!cont) return;
  const resultados = buscarProductos();
  if (!resultados.length) {
    cont.innerHTML = `<div class="sin-resultados">No se encontraron productos.</div>`;
    return;
  }
  const totalPaginas = Math.max(1, Math.ceil(resultados.length / POR_PAGINA));
  if (paginaActual > totalPaginas) paginaActual = totalPaginas;
  if (paginaActual < 1) paginaActual = 1;
  const inicio = (paginaActual - 1) * POR_PAGINA;
  const mostrados = resultados.slice(inicio, inicio + POR_PAGINA);

  const filas = mostrados.map(it => {
    const precio = precioDe(it);
    const puedeAgregar = !!precio && !it.st;
    const qtyEnCarrito = carrito.get(it.s) || 0;
    const control = qtyEnCarrito > 0
      ? `<div class="qty-stepper prod-qty" onclick="event.stopPropagation()">
           <button onclick="cambiarQtyCarrito('${it.s}', -1)">−</button>
           <input type="number" class="qty-val" min="1" step="1" value="${qtyEnCarrito}" onchange="setQtyCarrito('${it.s}', this.value)" onclick="this.select()">
           <button onclick="cambiarQtyCarrito('${it.s}', 1)">+</button>
         </div>`
      : `<button class="prod-add" onclick="event.stopPropagation(); agregarAlCarrito('${it.s}')" ${!puedeAgregar ? `disabled title="${it.st ? 'Sin stock disponible' : (it.cp ? 'Consultar precio por WhatsApp' : 'Sin precio en esta lista')}"` : ''}>+</button>`;
    const foto = it.img
      ? `<img class="prod-foto" src="https://drive.google.com/thumbnail?id=${it.img}&sz=w150" alt="" loading="lazy" onerror="this.parentElement.outerHTML='<div class=&quot;prod-foto prod-foto-vacia&quot;>🦷</div>'">`
      : `<div class="prod-foto prod-foto-vacia">🦷</div>`;
    const clickeable = qtyEnCarrito > 0
      ? ` onclick="quitarDelCarrito('${it.s}')"`
      : (puedeAgregar ? ` onclick="agregarAlCarrito('${it.s}')"` : '');
    const claseFila = `prod-row${(puedeAgregar || qtyEnCarrito > 0) ? ' prod-row-clickeable' : ''}${qtyEnCarrito > 0 ? ' prod-row-en-carrito' : ''}`;
    return `
      <div class="${claseFila}"${clickeable}>
        ${foto}
        <div class="prod-info">
          <div class="prod-sku">${escHtml(it.s)}</div>
          <div class="prod-nombre">${escHtml(it.n)}</div>
          ${it.of ? `<div class="prod-oferta">🏷️ Oferta</div>` : ''}
          ${it.st ? `<div class="prod-stock-agotado">Agotado</div>` : it.sb ? `<div class="prod-stock-bajo">Stock a confirmar</div>` : `<div class="prod-stock-en">En stock</div>`}
        </div>
        <div class="prod-precio">${it.cp ? '<span class="prod-consultar">Consultar precio</span>' : fmtMoney(precio)}</div>
        ${control}
      </div>`;
  }).join('');

  const paginacion = `
    <div class="paginacion">
      <span class="pag-info">Página ${paginaActual} de ${totalPaginas} — ${resultados.length} producto${resultados.length === 1 ? '' : 's'}</span>
      <div class="pag-botones">
        <button onclick="irAPagina(${paginaActual - 1})" ${paginaActual <= 1 ? 'disabled' : ''}>‹ Anterior</button>
        <button onclick="irAPagina(${paginaActual + 1})" ${paginaActual >= totalPaginas ? 'disabled' : ''}>Siguiente ›</button>
      </div>
      <div class="pag-salto">
        <span>Ir a página</span>
        <input type="number" id="input-pagina" min="1" max="${totalPaginas}" placeholder="${paginaActual}" onkeydown="if(event.key==='Enter') saltarAPagina()">
        <button onclick="saltarAPagina()">Ir</button>
      </div>
      <button class="btn-ir-final" onclick="irAlInicioDeLista()">⬆ Ir al inicio</button>
    </div>`;

  cont.innerHTML = filas + paginacion;
}

  requestAnimationFrame(() => { renderCarrito(); renderResultados(); });
};

  requestAnimationFrame(() => { renderCarrito(); renderResultados(); });
};

          <div class="qty-stepper">
            <button onclick="cambiarQtyCarrito('${sku}', -1)">−</button>
            <input type="number" class="qty-val" min="1" step="1" value="${qty}" onchange="setQtyCarrito('${sku}', this.value)" onclick="this.select()">
            <button onclick="cambiarQtyCarrito('${sku}', 1)">+</button>
          </div>
          <div class="ci-subtotal">${fmtMoney(precio * qty)}</div>
          <button class="ci-quitar" onclick="quitarDelCarrito('${sku}')">✕</button>
        </div>`;
    }).join('');
  }
  if (totalEl) totalEl.textContent = fmtMoney(calcularTotal());
  if (btn) btn.disabled = carrito.size === 0;
}

function renderPrincipal(){
  let listaLabel = listaActiva === 'p1' ? 'Contado (10% off)' : 'Tarjeta — 1 pago';
  if (listaActiva === 'p1' && medioPagoContado) listaLabel += ' — ' + MEDIO_CONTADO_LABEL[medioPagoContado];
  const entregaLabel = MODALIDAD_LABEL[modalidadEntrega] || '';
  app.innerHTML = `
    <div class="pago-activo">
      <span>Entrega: <b>${escHtml(entregaLabel)}</b></span>
      <button onclick="renderSeleccionEntrega()">Cambiar</button>
    </div>
    <div class="pago-activo">
      <span>Forma de pago: <b>${listaLabel}</b></span>
      <button onclick="cambiarPago()">Cambiar</button>
    </div>

    <div class="card">
      <h1>Buscar productos</h1>
      <div class="buscador-row">
        <input type="text" id="input-busqueda" placeholder="Nombre o SKU… (o dejá vacío para ver todo el catálogo)" oninput="onBusquedaInput(this.value)">
        <button class="btn-ir-final" onclick="irAlFinalDeLista()" title="Saltar al final de la lista">⬇ Ir al final</button>
      </div>
      <div class="filtros-row">
        <select id="sel-orden-precio" onchange="onFiltroChange()">
          <option value="">Ordenar por precio</option>
          <option value="asc">Precio: menor a mayor</option>
          <option value="desc">Precio: mayor a menor</option>
        </select>
        <select id="sel-marca" onchange="onFiltroChange()">
          <option value="todas">Todas las marcas</option>
          ${marcasDisponibles().map(m => `<option value="${escHtml(m)}">${escHtml(m)}</option>`).join('')}
        </select>
        <select id="sel-categoria" onchange="onFiltroChange()">
          <option value="todas">Todas las categorías</option>
          ${categoriasDisponibles().map(g => `<option value="${escHtml(g)}">${escHtml(g)}</option>`).join('')}
        </select>
        <label class="chk-ofertas"><input type="checkbox" id="chk-ofertas" onchange="onFiltroChange()"> Solo en ofertas</label>
      </div>
      <div class="resultados" id="resultados"></div>
    </div>

    <div class="card">
      <h1>Tu pedido</h1>
      <div id="carrito-items"></div>
      <div class="totales">
        <div class="row"><span>Total</span><span id="carrito-total">$0</span></div>
      </div>
    </div>

    <div class="card">
      <h1>Tus datos</h1>
      <div class="cliente-fields">
        <div class="field"><label>Cliente</label><input id="cf-nombre" type="text" placeholder="Nombre y apellido"></div>
        <div class="field"><label>E-mail</label><input id="cf-email" type="email" placeholder="tu@mail.com"></div>
        <div class="field"><label>Teléfono</label><input id="cf-tel" type="tel" placeholder="11 1234-5678"></div>
      </div>
      ${modalidadEntrega === 'envio' ? `
      <div class="field" style="margin-top:10px;"><label>Dirección de envío</label><input id="cf-direccion" type="text" placeholder="Calle, número, piso/depto, localidad"></div>
      ` : ''}
      <div class="field" style="margin-top:10px;"><label>Observaciones (opcional)</label><textarea id="cf-obs" placeholder="Alguna aclaración para tu pedido…"></textarea></div>
    </div>

    <button class="btn-enviar" id="btn-enviar" onclick="enviarPedido()" disabled>✓ Enviar pedido a Dentalab</button>
    <div class="nota">Al enviar, te llevamos a WhatsApp para avisarle a Dentalab con el resumen de tu pedido.</div>
    <div id="estado-msg"></div>
  `;
  renderResultados();
  renderCarrito();
}

let _busquedaTimer = null;
window.onBusquedaInput = (val) => {
  busqueda = val;
  paginaActual = 1;
  clearTimeout(_busquedaTimer);
  _busquedaTimer = setTimeout(renderResultados, 150);
};

window.onFiltroChange = () => {
  filtroOrdenPrecio = document.getElementById('sel-orden-precio')?.value || '';
  filtroMarca = document.getElementById('sel-marca')?.value || 'todas';
  filtroCategoria = document.getElementById('sel-categoria')?.value || 'todas';
  filtroSoloOfertas = document.getElementById('chk-ofertas')?.checked || false;
  paginaActual = 1;
  renderResultados();
};

window.enviarPedido = async () => {
  const btn = document.getElementById('btn-enviar');
  const nombre = document.getElementById('cf-nombre').value.trim();
  const email = document.getElementById('cf-email').value.trim();
  const tel = document.getElementById('cf-tel').value.trim();
  const direccion = document.getElementById('cf-direccion')?.value.trim() || '';
  const observaciones = document.getElementById('cf-obs')?.value.trim() || '';

  if (!carrito.size) { alert('Agregá al menos un producto antes de enviar.'); return; }

  btn.disabled = true;
  btn.textContent = 'Enviando…';
  // Abrir la pestaña ya, dentro del gesto de clic (si no, el navegador la bloquea
  // más adelante cuando ya no está "dentro" del clic, sobre todo en el celular).
  const waWindow = window.open('', '_blank');

  const items = [];
  carrito.forEach((qty, sku) => {
    const it = catalogoBySku.get(sku);
    if (it) items.push({ sku: it.s, nombre: it.n, precio: precioDe(it), qty });
  });
  const total = calcularTotal();

  const id = (() => { try { return crypto.randomUUID().replace(/-/g,''); } catch(e) { return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2,10); } })();

  let formaPagoTexto = listaActiva === 'p1' ? 'Contado (10% off)' : 'Tarjeta — 1 pago';
  if (listaActiva === 'p1' && medioPagoContado) formaPagoTexto += ' — ' + MEDIO_CONTADO_LABEL[medioPagoContado];

  const payload = {
    id, cliente: { nombre, email, tel },
    modalidadEntrega: MODALIDAD_LABEL[modalidadEntrega] || '',
    direccionEnvio: direccion,
    formaPago: formaPagoTexto,
    medioPagoContado: (listaActiva === 'p1' && medioPagoContado) ? MEDIO_CONTADO_LABEL[medioPagoContado] : '',
    observaciones,
    items, total,
    estado: 'pendiente',
    creadoAt: Date.now()
  };

  try {
    await db.ref('dentalab/pedidos_web/' + id).set(payload);
    document.getElementById('estado-msg').innerHTML =
      `<div class="estado-msg ok">✓ ¡Listo! Te llevamos a WhatsApp para avisarle a Dentalab…</div>`;
    btn.style.display = 'none';

    const WA_NUM = '5491168714595';
    let msg = `Hola!${nombre ? ' Soy ' + nombre + '.' : ''} Armé mi pedido por el link de WhatsApp — ${payload.modalidadEntrega}, ${payload.formaPago}, por un total de ${fmtMoney(total)}.`;
    if (direccion) msg += ` Dirección: ${direccion}.`;
    if (observaciones) msg += ` Observaciones: ${observaciones}.`;
    msg += ' ¿Podrían confirmarme?';
    const waLink = `https://wa.me/${WA_NUM}?text=${encodeURIComponent(msg)}`;
    setTimeout(() => {
      if (waWindow) waWindow.location.href = waLink; else window.open(waLink, '_blank');
    }, 900);
  } catch (e) {
    if (waWindow) waWindow.close();
    document.getElementById('estado-msg').innerHTML =
      `<div class="estado-msg err">No pudimos enviar el pedido. Revisá tu conexión e intentá de nuevo.</div>`;
    btn.disabled = false;
    btn.textContent = '✓ Enviar pedido a Dentalab';
  }
};

cargarCatalogo();
</script>
</body>
</html>
